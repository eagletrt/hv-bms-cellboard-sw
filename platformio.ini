[platformio]
src_dir = .
include_dir = .
default_envs = release

[env]

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libblinky-sw.git#v1.0.0
    https://github.com/eagletrt/libbms-monitor-sw.git#dev
    https://github.com/eagletrt/libcan-sw.git#master
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libmin-heap-sw.git#v0.2.0

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

debug_build_flags = -g

board = stm32g4a1
board_build.ldscript = ./STM32G4A1KEUx_FLASH.ld

build_flags =
    -std=gnu23
    -Wl,-Map,./.pio/build/release/output_release.map
    -DUSE_HAL_DRIVER
    -D_XOPEN_SOURCE ; Used for 'strptime'
    -D_STATIC=
    -D_STATIC_INLINE=
    -D_VOLATILE=
    -ICore/Inc
    -ICore/Inc/common
    -ICore/Inc/bms
    -ICore/Inc/bms/errors
    -ICore/Inc/bms/monitor
    -ICore/Inc/bms/timebase
    -ICore/Inc/bms/identity
    -ICore/Inc/bms/led
    -ICore/Inc/bms/volt
    -ICore/Inc/bms/programmer
    -ICore/Inc/bms/balancing
    -ICore/Inc/bms/post
    -ICore/Inc/bms/temp
    -ICore/Inc/bms/can-communication
    -ICore/Lib/micro-libs/errorlib/inc
    -IDrivers/CMSIS/Device/ST/STM32G4xx/Include
    -IDrivers/CMSIS/Core/Include
    -IDrivers/STM32G4xx_HAL_Driver/Inc
build_src_filter =
    +<Core/Src/**>
    +<Core/Lib/micro-libs/errorlib/src/**>
    +<Drivers/STM32G4xx_HAL_Driver/Src/**>
    -<Drivers/STM32G4xx_HAL_Driver/Src/*_template.c>
    +<./startup_stm32g4a1xx.s>

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/bms/**>
    +<Core/Inc/bms/**>

[env:tests]
platform = native
test_framework = unity
test_build_src = true

build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=
    -DUSE_HAL_DRIVER
    -D_XOPEN_SOURCE
    -D_STATIC=
    -D_STATIC_INLINE=
    -D_VOLATILE=
    -DIDENTITY_BUILD_TIME_STRING=\"Jun\ 23\ 2024\ 12:00:00\"
    -lm
    -Itest/include
    -ICore/Inc
    -ICore/Inc/common
    -ICore/Inc/bms
    -ICore/Inc/bms/errors
    -ICore/Inc/bms/monitor
    -ICore/Inc/bms/timebase
    -ICore/Inc/bms/identity
    -ICore/Inc/bms/led
    -ICore/Inc/bms/volt
    -ICore/Inc/bms/programmer
    -ICore/Inc/bms/balancing
    -ICore/Inc/bms/post
    -ICore/Inc/bms/temp
    -ICore/Inc/bms/can-communication
    -ICore/Lib
    -ICore/Lib/can/lib
    -ICore/Lib/can/lib/bms
    -ICore/Lib/micro-libs/errorlib/inc
build_src_filter =
    +<Core/Src/bms/>
    +<Core/Lib/micro-libs/errorlib/src/**>

[env:bootloader]
platform = ststm32
board = stm32g4a1
upload_protocol = stlink
monitor_speed = 115200
board_build.ldscript = ./hv-bms-cellboard-bootloader-sw/STM32G4A1KEUx_FLASH.ld

build_flags =
    -std=gnu23
    -Wl,-Map,./.pio/build/bootloader/output_bootloader.map

    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -Ihv-bms-cellboard-bootloader-sw/Core/Inc
    -Ihv-bms-cellboard-bootloader-sw/Core/Inc/libopenblt

    -Ihv-bms-cellboard-bootloader-sw/Drivers/CMSIS/Device/ST/STM32G4xx/Include
    -Ihv-bms-cellboard-bootloader-sw/Drivers/CMSIS/Core/Include
    -Ihv-bms-cellboard-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Inc

build_src_filter =
    +<hv-bms-cellboard-bootloader-sw/Core/Src/**>
    +<hv-bms-cellboard-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Src/**>
    +<hv-bms-cellboard-bootloader-sw/startup_stm32g4a1xx.s>

    -<hv-bms-cellboard-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_msp_template.c>
    -<hv-bms-cellboard-bootloader-sw/Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_timebase_tim_template.c>

